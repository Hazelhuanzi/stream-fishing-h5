<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfe9f7">
<title>小物钓 · 溪流小钓手</title>
<!--
  素材与本文件必须放在同一目录结构下（双击 index.html 即可运行）：
  assets/fishing/stream-bg.png      溪流背景
  assets/fishing/paws-*.png         第一人称猫爪（待补；当前用 CSS 占位）
  assets/fishing/rod-fp.png         第一人称鱼竿（待补；当前用 CSS 占位）
  assets/fishing/fish-pangpi.png    鳑鲏
  assets/fishing/fish-baitiao.png   白条
  assets/fishing/fish-yingu.png     银鲴
  assets/fishing/fish-heiqiquan.png 黑鳍鳈
  assets/fishing/splash.png         水花
  assets/fishing/bubbles.png        气泡
  assets/fishing/basket.png         鱼篓
  assets/fishing/cat-sheet.png      奶牛猫设定图（仅非钓鱼界面备用）
  assets/fishing/rod.png            旧第三人称鱼竿（当前未使用）
  第一人称的猫爪/鱼竿暂时是 CSS 占位，替换规格见 docs/asset-spec.md。
-->
<style>
  :root {
    --ink: #2d5b6b;
    --ink-soft: #5b7f8c;
    --blue: #35a7d6;
    --blue-deep: #2389bd;
    --mint: #4fc3a1;
    --coral: #ff7d5c;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    overscroll-behavior: none;
    background: radial-gradient(circle at 50% 18%, #effbff 0%, #cdefff 42%, #9ed9f2 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  button { font-family: inherit; }
  img { -webkit-user-drag: none; }
  [hidden] { display: none !important; }

  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 9 / 16));
    height: min(100vh, calc(100vw * 16 / 9));
    overflow: hidden;
    isolation: isolate;
    background: #bfe9f7;
    box-shadow: 0 30px 90px rgba(44, 112, 140, .3);
  }
  @supports (height: 100dvh) {
    .stage {
      width: min(100vw, calc(100dvh * 9 / 16));
      height: min(100dvh, calc(100vw * 16 / 9));
    }
  }
  @media (min-width: 640px) {
    .stage { border-radius: 26px; }
  }

  /* ============ 场景底图 ============ */
  .scene-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    /* 临时：裁掉生成图右下角的水印；换成正稿背景后删掉这两行 */
    transform-origin: 50% 0;
    transform: scale(1.09);
  }
  .scene-shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(255,255,255,.46) 0%, rgba(255,255,255,.10) 22%, rgba(255,255,255,0) 52%, rgba(238,251,255,.42) 100%);
  }

  .bubbles {
    position: absolute;
    z-index: 2;
    right: -12%;
    bottom: -3%;
    width: 78%;
    opacity: .5;
    mix-blend-mode: multiply;
    pointer-events: none;
    animation: bubbleFloat 10s ease-in-out infinite alternate;
  }
  @keyframes bubbleFloat {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-2.5%) scale(1.02); }
  }

  /* ============ 顶部 HUD ============ */
  .hud {
    position: absolute;
    z-index: 8;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    padding: calc(10px + var(--safe-top)) 10px 0;
    pointer-events: none;
  }
  .hud-chip {
    background: rgba(255, 255, 255, .74);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .92);
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(41, 112, 139, .13);
  }
  .hud-left { padding: 8px 12px 9px; }
  .hud-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .14em;
    color: #2e7e99;
    line-height: 1.15;
  }
  .hud-count {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .hud-count b { font-size: 15px; color: var(--blue-deep); }
  .count-icon {
    width: 20px;
    height: 20px;
    object-fit: contain;
    margin-left: 1px;
    mix-blend-mode: multiply;
  }
  .slots {
    display: flex;
    gap: 6px;
    padding: 6px;
  }
  .slot {
    position: relative;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
    border: 2px solid #fff;
    box-shadow: inset 0 0 0 1px rgba(70, 150, 180, .14);
  }
  .slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.55);
    mix-blend-mode: multiply;
    filter: grayscale(1) brightness(1.14) opacity(.34);
    transition: filter .35s ease;
  }
  .slot.got { box-shadow: 0 0 0 2px rgba(79, 195, 161, .55), 0 3px 10px rgba(41, 112, 139, .16); }
  .slot.got img { filter: none; }
  .slot.pop { animation: slotPop .55s ease; }
  @keyframes slotPop {
    0%, 100% { transform: scale(1); }
    45% { transform: scale(1.3); }
  }

  @media (max-width: 360px) {
    .slot { width: 30px; height: 30px; }
    .slots { gap: 5px; padding: 5px; }
    .hud-left { padding: 7px 10px; }
    .hud-title { font-size: 14px; }
    .hud-count { font-size: 11px; }
  }

  /* ============ 第一人称握竿（占位；后续替换 paws-*.png / rod-fp.png） ============ */
  .fp-line {
    position: absolute;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity .22s ease;
  }
  .fp-line path {
    fill: none;
    stroke: rgba(52, 74, 84, .55);
    stroke-width: 1.6;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  [data-state="waiting"] .fp-line,
  [data-state="bite"] .fp-line,
  [data-state="reeling"] .fp-line,
  [data-state="landing"] .fp-line { opacity: .9; }

  .fp-rig {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  .fp-rod {
    position: absolute;
    right: 8%;
    bottom: 6%;
    width: 9px;
    height: 66%;
    transform-origin: 50% 100%;
    transform: rotate(-16deg);
    border-radius: 999px 999px 4px 4px;
    background:
      repeating-linear-gradient(180deg, rgba(96, 62, 30, .26) 0 2px, transparent 2px 58px),
      linear-gradient(90deg, #9c6a36 0%, #e7c78d 38%, #f3ddb0 52%, #c89355 78%, #8d5d2f 100%);
    box-shadow: 0 0 0 1px rgba(92, 58, 28, .18), 2px 0 6px rgba(40, 30, 20, .12);
    filter: drop-shadow(0 6px 10px rgba(40, 70, 80, .12));
  }
  .fp-rod::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -2.5%;
    width: 1.5px;
    height: 4%;
    transform: translateX(-50%);
    border-radius: 999px;
    background: #6b4724;
  }
  .fp-rod::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -1%;
    width: 240%;
    height: 13%;
    transform: translateX(-50%);
    border-radius: 999px;
    background: linear-gradient(90deg, #6b4724, #a9773e 40%, #6b4724);
    box-shadow: inset 0 2px 0 rgba(255, 230, 190, .35);
  }

  .fp-paws {
    position: absolute;
    right: 4%;
    bottom: 3%;
    width: 26%;
    height: 14%;
    z-index: 6;
    transform-origin: 80% 100%;
  }
  .paw {
    position: absolute;
    border: 1px solid rgba(120, 95, 65, .12);
    border-radius: 48% 48% 44% 44% / 54% 54% 46% 46%;
    background:
      radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .95), transparent 55%),
      linear-gradient(160deg, #fffaf0 0%, #f0e4d2 58%, #ddc9ad 100%);
    box-shadow:
      inset 0 -6px 10px rgba(150, 120, 90, .16),
      inset 0 2px 0 rgba(255, 255, 255, .9),
      0 6px 14px rgba(40, 70, 80, .18);
  }
  .paw::before {
    content: "";
    position: absolute;
    left: 18%;
    top: 8%;
    width: 44%;
    height: 42%;
    border-radius: 50% 40% 55% 45%;
    background: #2f2f33;
    opacity: .9;
    transform: rotate(-8deg);
  }
  .paw::after {
    content: "";
    position: absolute;
    left: 28%;
    right: 28%;
    bottom: 14%;
    height: 2px;
    border-radius: 999px;
    background: rgba(150, 120, 90, .38);
    box-shadow: 0 -8px 0 rgba(150, 120, 90, .22);
  }
  .paw-b::before { display: none; }
  .paw-a {
    right: 0;
    bottom: 0;
    width: 58%;
    height: 90%;
    transform: rotate(-12deg);
  }
  .paw-b {
    right: 42%;
    bottom: 8%;
    width: 48%;
    height: 76%;
    transform: rotate(9deg);
  }

  /* 鱼竿 / 猫爪 状态动画 */
  [data-state="idle"] .fp-rod { animation: rodIdle 4.2s ease-in-out infinite; }
  [data-state="waiting"] .fp-rod { animation: rodWait 3.2s ease-in-out infinite; }
  [data-state="casting"] .fp-rod { animation: rodCast .92s cubic-bezier(.2, .75, .3, 1) both; }
  [data-state="bite"] .fp-rod { animation: rodBite .11s linear infinite; }
  [data-state="reeling"] .fp-rod { animation: rodReel .3s ease-in-out infinite alternate; }
  [data-state="landing"] .fp-rod { animation: rodLift .62s cubic-bezier(.2, 1.2, .4, 1) both; }
  [data-state="miss"] .fp-rod { animation: rodDroop .6s ease both; }

  @keyframes rodIdle {
    0%, 100% { transform: rotate(-16deg) translateY(0); }
    50% { transform: rotate(-16.8deg) translateY(-3px); }
  }
  @keyframes rodWait {
    0%, 100% { transform: rotate(-16deg) translateY(0); }
    50% { transform: rotate(-15.2deg) translateY(-5px); }
  }
  @keyframes rodCast {
    0% { transform: rotate(-2deg) translate(3%, 4%); }
    22% { transform: rotate(-32deg) translate(-2%, -2%); }
    58% { transform: rotate(-8deg) translate(0, -1%); }
    100% { transform: rotate(-16deg) translate(0, 0); }
  }
  @keyframes rodBite {
    0%, 100% { transform: rotate(-16deg) translate(0, 0); }
    25% { transform: rotate(-17.6deg) translate(-2px, 1px); }
    75% { transform: rotate(-14.4deg) translate(2px, -1px); }
  }
  @keyframes rodReel {
    from { transform: rotate(-14deg) translateY(0); }
    to { transform: rotate(-19deg) translateY(-4px); }
  }
  @keyframes rodLift {
    0% { transform: rotate(-16deg); }
    40% { transform: rotate(-34deg) translate(-1%, -2%); }
    100% { transform: rotate(-28deg) translate(-1%, -1%); }
  }
  @keyframes rodDroop {
    0% { transform: rotate(-16deg); }
    100% { transform: rotate(-10deg) translateY(6px); }
  }

  [data-state="bite"] .paw-a { animation: pawGrip .11s linear infinite; }
  [data-state="reeling"] .paw-b { animation: pawCrank .3s ease-in-out infinite alternate; }
  [data-state="landing"] .fp-paws { animation: pawsLift .6s cubic-bezier(.2, 1.2, .4, 1) both; }
  [data-state="miss"] .fp-paws { animation: pawsDroop .55s ease both; }
  @keyframes pawGrip {
    0%, 100% { transform: rotate(-12deg) scale(1); }
    50% { transform: rotate(-13.5deg) scale(1.035); }
  }
  @keyframes pawCrank {
    from { transform: rotate(9deg) translateY(0); }
    to { transform: rotate(13deg) translateY(-4px); }
  }
  @keyframes pawsLift {
    0% { transform: translateY(0); }
    45% { transform: translateY(-10px); }
    100% { transform: translateY(-4px); }
  }
  @keyframes pawsDroop {
    0% { transform: translateY(0); }
    100% { transform: translateY(8px); }
  }

  /* ============ 浮漂水域 ============ */
  .float-area {
    position: absolute;
    z-index: 3;
    left: 34%;
    top: 37%;
    width: 27%;
    aspect-ratio: 1;
    pointer-events: none;
  }
  .ripple {
    position: absolute;
    left: 50%;
    top: 55%;
    width: 64%;
    aspect-ratio: 1;
    border: 2px solid rgba(255, 255, 255, .82);
    border-radius: 50%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(.25);
  }
  [data-state="waiting"] .ripple { animation: ripple 3.6s ease-out infinite; }
  [data-state="waiting"] .ripple.r2 { animation-delay: 1.2s; }
  [data-state="waiting"] .ripple.r3 { animation-delay: 2.4s; }
  [data-state="bite"] .ripple { animation: ripple 1.05s ease-out infinite; border-color: rgba(255, 255, 255, .95); }
  [data-state="reeling"] .ripple { animation: ripple 1.35s ease-out infinite; border-color: rgba(255, 255, 255, .95); }
  @keyframes ripple {
    0% { transform: translate(-50%, -50%) scale(.25); opacity: 0; }
    14% { opacity: .9; }
    100% { transform: translate(-50%, -50%) scale(1.65); opacity: 0; }
  }

  .bobber {
    position: absolute;
    left: 50%;
    top: 52%;
    width: 16%;
    aspect-ratio: 12 / 40;
    transform: translate(-50%, -50%);
    opacity: 0;
    filter: drop-shadow(0 3px 3px rgba(40, 100, 120, .2));
  }
  .bobber::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 22%;
    height: 56%;
    min-width: 2px;
    border-radius: 999px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #ff9a86 0%, #ff5f4a 100%);
  }
  .bobber::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 100%;
    height: 56%;
    transform: translateX(-50%);
    border: 1.5px solid #e57361;
    border-radius: 48% 48% 52% 52%;
    background: linear-gradient(180deg, #ffffff 0%, #fff1ee 60%, #ff9c88 100%);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .85);
  }
  [data-state="casting"] .bobber {
    opacity: 1;
    animation: bobberCast .9s cubic-bezier(.22, .8, .35, 1) both;
  }
  [data-state="waiting"] .bobber {
    opacity: 1;
    animation: bobberBob 2.4s ease-in-out infinite;
  }
  [data-state="bite"] .bobber {
    opacity: 1;
    animation: bobberBite .12s linear infinite;
  }
  [data-state="reeling"] .bobber {
    opacity: 1;
    animation: bobberBite .2s linear infinite;
  }
  [data-state="landing"] .bobber,
  [data-state="miss"] .bobber {
    opacity: 0;
    transition: opacity .3s ease;
  }
  @keyframes bobberCast {
    0% { transform: translate(calc(-50% + 120px), calc(-50% - 90px)) scale(.45) rotate(28deg); opacity: 0; }
    25% { opacity: 1; }
    70% { transform: translate(calc(-50% + 10px), calc(-50% - 16px)) scale(1.06) rotate(12deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes bobberBob {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, calc(-50% + 5px)); }
  }
  @keyframes bobberBite {
    0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
    25% { transform: translate(calc(-50% - 4px), calc(-50% + 2px)) rotate(-10deg); }
    75% { transform: translate(calc(-50% + 4px), calc(-50% + 2px)) rotate(10deg); }
  }

  .splash {
    position: absolute;
    z-index: 1;
    left: 50%;
    top: 54%;
    width: 138%;
    max-width: none;
    transform: translate(-50%, -50%) scale(.35);
    opacity: 0;
    mix-blend-mode: darken;
    filter: brightness(1.14) contrast(1.06);
    -webkit-mask-image: radial-gradient(ellipse 52% 46% at 50% 55%, #000 38%, rgba(0, 0, 0, .8) 62%, transparent 84%);
    mask-image: radial-gradient(ellipse 52% 46% at 50% 55%, #000 38%, rgba(0, 0, 0, .8) 62%, transparent 84%);
    pointer-events: none;
  }
  .splash.show { animation: splashBurst .8s ease-out both; }
  @keyframes splashBurst {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.35); }
    22% { opacity: .95; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.35); }
  }

  /* ============ 提示 & 收线面板 ============ */
  .prompt {
    position: absolute;
    z-index: 7;
    top: 17%;
    left: 50%;
    transform: translateX(-50%);
    padding: 9px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .82);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(41, 112, 139, .15);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .03em;
    color: #2c6d82;
    white-space: nowrap;
    transition: background .25s ease, color .25s ease, opacity .2s ease;
  }
  [data-state="bite"] .prompt {
    background: linear-gradient(135deg, #ffa36f 0%, #ff6f50 100%);
    color: #fff;
    animation: promptPulse .55s ease-in-out infinite alternate;
    box-shadow: 0 8px 26px rgba(255, 100, 70, .36);
  }
  [data-state="landing"] .prompt {
    background: linear-gradient(135deg, #7bd8bb 0%, #3db697 100%);
    color: #fff;
  }
  [data-state="card"] .prompt { opacity: 0; }
  [data-state="miss"] .prompt { opacity: 0; }
  @keyframes promptPulse {
    from { transform: translateX(-50%) scale(1); }
    to { transform: translateX(-50%) scale(1.05); }
  }

  .reel-panel {
    position: absolute;
    z-index: 8;
    top: 26.5%;
    left: 50%;
    transform: translateX(-50%);
    width: 78%;
    padding: 12px 14px 11px;
    border-radius: 18px;
    background: rgba(255, 255, 255, .84);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .92);
    box-shadow: 0 10px 30px rgba(41, 112, 139, .16);
  }
  .reel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 12.5px;
    font-weight: 700;
    color: #2e7e99;
  }
  .reel-head b { font-size: 17px; color: #219c7d; }
  .reel-ticks {
    display: flex;
    gap: 5px;
    height: 12px;
    margin-top: 8px;
  }
  .reel-tick {
    flex: 1;
    border-radius: 999px;
    background: rgba(96, 170, 190, .18);
    transition: background .12s ease, transform .12s ease;
  }
  .reel-tick.on {
    background: linear-gradient(90deg, #5fd0ae, #34b28f);
    transform: scaleY(1.16);
  }
  .reel-time {
    height: 5px;
    margin-top: 9px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(96, 170, 190, .16);
  }
  .reel-time-fill {
    display: block;
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #ffd66b, #ff8b62);
  }
  .reel-hint {
    margin-top: 6px;
    font-size: 11px;
    font-weight: 600;
    color: #7d9aa5;
    text-align: center;
  }

  /* ============ 底部按钮（左下；右下留给猫爪） ============ */
  .bottom {
    position: absolute;
    z-index: 9;
    left: 4%;
    right: auto;
    width: 54%;
    bottom: calc(4% + var(--safe-bottom));
    padding: 0;
    background: none;
    transition: opacity .25s ease;
  }
  [data-state="card"] .bottom { opacity: 0; pointer-events: none; }
  .action-btn {
    display: block;
    width: 100%;
    height: 64px;
    border: 0;
    border-radius: 18px;
    background: linear-gradient(135deg, #66cbea 0%, #37a6d6 55%, #2b93c9 100%);
    box-shadow: 0 8px 0 #1f7fa8, 0 12px 24px rgba(35, 137, 189, .3);
    color: #fff;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .1em;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .08s ease, box-shadow .08s ease, background .25s ease, opacity .2s ease;
  }
  .action-btn:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 4px 0 #1f7fa8, 0 7px 16px rgba(35, 137, 189, .28);
  }
  .action-btn[data-tone="bite"] {
    background: linear-gradient(135deg, #ffb06e 0%, #ff7b57 55%, #f2603c 100%);
    box-shadow: 0 8px 0 #c94a2a, 0 12px 26px rgba(255, 100, 70, .38);
    animation: btnPulse .5s ease-in-out infinite alternate;
  }
  .action-btn[data-tone="reel"] {
    background: linear-gradient(135deg, #6ad7b6 0%, #43bba0 55%, #2ba184 100%);

  @media (max-width: 360px) {
    .book-top { padding: 12px 10px 8px 20px; }
    .book-title { font-size: 19px; }

  }
</style>

<body>
<div class="stage" id="stage" data-state="idle">

  <img class="scene-bg" src="./assets/fishing/stream-bg.png" alt="" draggable="false" decoding="async">
  <div class="scene-shade"></div>
  <img class="bubbles" src="./assets/fishing/bubbles.png" alt="" draggable="false" decoding="async">

  <!-- 顶部收集 -->
  <header class="hud">
    <div class="hud-chip hud-left">
      <div class="hud-title">小物钓</div>
      <div class="hud-count">已收集 <b id="collectCount">0</b> / 4
        <img class="count-icon" src="./assets/fishing/basket.png" alt="鱼篓" draggable="false">
      </div>
    </div>
    <div class="hud-chip slots" id="slots" aria-label="鱼种收集进度"></div>
  </header>

  <button class="gyro-fab" id="gyroFab" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="体感设置">
    <span class="gyro-fab-dot" id="gyroDot"></span>体感
  </button>

  <!-- 第一人称：鱼线（坐标按 9:16 舞台，终点=浮漂中心） -->
  <svg class="fp-line" id="fpLine" viewBox="0 0 900 1600" preserveAspectRatio="none" aria-hidden="true">
    <path d="M538 510 Q480 620 428 714" />
  </svg>

  <!-- 第一人称握竿 + 猫爪（占位素材，后续替换 rod-fp.png / paws-*.png） -->
  <div class="fp-rig" id="fpRig" aria-hidden="true">
    <div class="fp-rod" id="fpRod"></div>
    <div class="fp-paws" id="fpPaws">
      <span class="paw paw-a"></span>
      <span class="paw paw-b"></span>
    </div>
  </div>

  <!-- 浮漂水域 -->
  <div class="float-area">
    <div class="ripple r1"></div>
    <div class="ripple r2"></div>
    <div class="ripple r3"></div>
    <img class="splash" id="splash" src="./assets/fishing/splash.png" alt="" draggable="false" decoding="async">
    <div class="bobber"></div>
  </div>

  <div class="prompt" id="prompt" role="status" aria-live="polite">溪水清浅，抛一竿试试</div>

  <!-- 收线进度 -->
  <div class="reel-panel" id="reelPanel" hidden>
    <div class="reel-head">
      <span>收线进度</span>
      <span><b id="reelCount">0</b> / 5</span>
    </div>
    <div class="reel-ticks">
      <i class="reel-tick"></i><i class="reel-tick"></i><i class="reel-tick"></i><i class="reel-tick"></i><i class="reel-tick"></i>
    </div>
    <div class="reel-time"><i class="reel-time-fill" id="reelTimeFill"></i></div>
    <div class="reel-hint">3 秒内点满 5 次</div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 底部操作 -->
  <div class="bottom">
    <button class="action-btn" id="actionBtn" data-tone="normal" type="button">抛竿</button>
  </div>

  <!-- 图鉴入口：只在岸边显示 -->
  <button class="book-fab" id="bookFab" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="打开图鉴，已收集 0 / 4">
    <span class="book-fab-icon" aria-hidden="true">📖</span>
    <span class="book-fab-text">图鉴 <b id="bookFabCount">0/4</b></span>
  </button>

  <!-- 体感设置 -->
  <div class="gyro-sheet" id="gyroSheet" hidden>
    <div class="gyro-card" role="dialog" aria-modal="true" aria-labelledby="gyroTitle">
      <div class="gyro-head">
        <b id="gyroTitle">体感设置</b>
        <button class="gyro-close" id="gyroClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="gyro-status" id="gyroStatus">陀螺仪：未开启</div>
      <div class="gyro-actions">
        <button class="primary" id="gyroEnable" type="button">开启体感</button>
        <button id="gyroCalibrate" type="button">校准姿势</button>
      </div>
      <label class="gyro-row">灵敏度
        <input id="gyroSensitivity" type="range" min="0.5" max="2" step="0.1" value="1">
        <span id="gyroSensitivityVal">1.0</span>
      </label>
      <label class="gyro-row">反转抛竿方向
        <input id="gyroInvert" type="checkbox">
      </label>
      <div class="gyro-debug" id="gyroDebug">等待动作数据…</div>
      <div class="gyro-test">
        <button id="gyroSimCast" type="button">模拟抛竿</button>
        <button id="gyroSimBite" type="button">模拟咬钩</button>
        <button id="gyroSimHook" type="button">模拟抬竿</button>
      </div>
      <p class="gyro-note">手机需要点上面的「开启体感」并允许动作权限。iOS 要求 HTTPS 页面；电脑没有陀螺仪，可用模拟按钮测试。</p>
    </div>
  </div>

  <!-- 科普卡片 -->
  <div class="card-overlay" id="cardOverlay" hidden>
    <div class="card" id="card">
      <div class="card-badge" id="cardBadge">新鱼种！</div>
      <div class="card-scroll">
        <div class="card-fish"><img id="cardFish" src="./assets/fishing/fish-pangpi.png" alt=""></div>
        <h2 class="card-name"><span id="cardName">鳑鲏</span><span class="rarity common" id="cardRarity">常见</span></h2>
        <p class="card-fact" id="cardFact"></p>
        <div class="card-ach" id="cardAch" hidden><span aria-hidden="true">🏅</span><span id="cardAchText"></span></div>
        <div class="card-meta">
          <img src="./assets/fishing/basket.png" alt="" draggable="false">
          <span id="cardProgress">已收集 0 / 4</span>
        </div>
        <button class="release-btn" id="releaseBtn" type="button">放流</button>
      </div>
    </div>
  </div>

  <!-- 溪流小物钓图鉴 -->
  <div class="book-overlay" id="bookOverlay" hidden>
    <div class="book" role="dialog" aria-modal="true" aria-labelledby="bookTitle">
      <div class="book-top">
        <div class="book-title-wrap">
          <div class="book-kicker">小物钓观察手册</div>
          <h2 class="book-title" id="bookTitle">溪流小物钓图鉴</h2>
          <div class="book-sub">点亮每一格，认识溪流里的小居民</div>
        </div>
        <button class="book-close" id="bookClose" type="button" aria-label="合上图鉴">×</button>
      </div>
      <div class="book-scroll" id="bookScroll">
        <section id="bookHome">
          <div class="book-progress-row">
            <span>已点亮</span>
            <span><b id="bookProgressCount">0</b> / 4</span>
          </div>
          <div class="book-bar" id="bookBar" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </div>
          <div class="book-grid" id="bookGrid"></div>
          <div class="book-section-title"><span>钓鱼成就</span><small>共 4 项</small></div>
          <div class="ach-list" id="bookAchievements"></div>
        </section>
        <section id="bookDetail" hidden>
          <button class="book-back" id="bookBack" type="button">← 返回图鉴</button>
          <div class="book-detail-fish" id="bookDetailFishWrap">
            <img id="bookDetailFish" src="./assets/fishing/fish-pangpi.png" alt="">
          </div>
          <div class="book-detail-head">
            <h3 class="book-detail-name" id="bookDetailName">鳑鲏</h3>
            <span class="rarity common" id="bookDetailRarity">常见</span>
          </div>
          <div class="book-detail-no" id="bookDetailNo">NO.01</div>
          <p class="book-detail-fact" id="bookDetailFact"></p>
          <div class="book-detail-status" id="bookDetailStatus">已点亮</div>
        </section>
      </div>
      <div class="book-footer">
        <button class="book-reset" id="bookReset" type="button">重置图鉴</button>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ======== 可调参数 ========
  var CONFIG = {
    WAIT_MIN: 3000,      // 等待咬钩最短
    WAIT_MAX: 8000,      // 等待咬钩最长
    BITE_WINDOW: 1500,   // 抬竿窗口
    CATCH_RATE: 0.7,     // 窗口内抬竿中鱼率
    REEL_TAPS: 5,        // 收线点击次数
    REEL_TIMEOUT: 3000,  // 收线时限
    CAST_ANIM: 900,      // 抛竿动画
    MISS_HOLD: 1500,     // 跑鱼提示停留
    CARD_DELAY: 420,     // 中鱼到卡片弹出
    COMMON_WEIGHT: 35,   // 常见鱼（鳑鲏、白条）权重
    RARE_WEIGHT: 15      // 稀有鱼（银鲴、黑鳍鳈）权重
  };

  var FISH = [
    {
      id: 'pangpi',
      name: '鳑鲏',
      rarity: 'common',
      img: './assets/fishing/fish-pangpi.png',
      fact: '繁殖期的雄鱼身披绚丽彩衣，会把卵产进河蚌的鳃腔里，由河蚌悄悄帮忙护卵。'
    },
    {
      id: 'baitiao',
      name: '白条',
      rarity: 'common',
      img: './assets/fishing/fish-baitiao.png',
      fact: '中上层的小快鱼，游速飞快，最爱成群在水面追逐落水的虫子，是溪边最常见的“抢食王”。'
    },
    {
      id: 'yingu',
      name: '银鲴',
      rarity: 'rare',
      img: './assets/fishing/fish-yingu.png',
      fact: '常贴着石头刮食藻类和有机碎屑，是溪流里勤快的“清洁工”，能让水质更清亮。'
    },
    {
      id: 'heiqiquan',
      name: '黑鳍鳈',
      rarity: 'rare',
      img: './assets/fishing/fish-heiqiquan.png',
      fact: '底栖小型鱼，体侧有一条黑色纵纹，喜欢砾石底的清凉溪流与缓慢水流。'
    }
  ];

  function findFish(id) {
    return FISH.filter(function (f) { return f.id === id; })[0] || null;
  }

  function rarityText(fish) {
    return fish.rarity === 'rare' ? '稀有' : '常见';
  }

  // 成就全部由已收集图鉴推导，重置图鉴后会一起归零
  var ACHIEVEMENTS = [
    {
      id: 'first', icon: '🌱', name: '初次相识', desc: '钓到第 1 种鱼', target: 1,
      progress: function (set) { return set.size; }
    },
    {
      id: 'angler', icon: '🎣', name: '钓鱼达人', desc: '收集 3 种不同的鱼', target: 3,
      progress: function (set) { return set.size; }
    },
    {
      id: 'rare', icon: '✨', name: '稀有发现', desc: '钓到任意一种稀有鱼（银鲴 / 黑鳍鳈）', target: 1,
      progress: function (set) {
        return Array.from(set).filter(function (id) {
          var f = findFish(id);
          return f && f.rarity === 'rare';
        }).length;
      }
    },
    {
      id: 'master', icon: '🏅', name: '溪流图鉴大师', desc: '集齐图鉴全部 4 种鱼', target: 4,
      progress: function (set) { return set.size; }
    }
  ];

  function isAchievementDone(achievement, set) {
    return achievement.progress(set) >= achievement.target;
  }

  var STORAGE_KEY = 'xiaowudiao.collected.v1';

  var stage = document.getElementById('stage');
  var actionBtn = document.getElementById('actionBtn');
  var promptEl = document.getElementById('prompt');
  var toastEl = document.getElementById('toast');
  var slotsEl = document.getElementById('slots');
  var countEl = document.getElementById('collectCount');
  var reelPanel = document.getElementById('reelPanel');
  var reelCountEl = document.getElementById('reelCount');
  var reelTicks = Array.prototype.slice.call(document.querySelectorAll('.reel-tick'));
  var reelTimeFill = document.getElementById('reelTimeFill');
  var splash = document.getElementById('splash');
  var fpRig = document.getElementById('fpRig');
  var fpRod = document.getElementById('fpRod');
  var fpPaws = document.getElementById('fpPaws');
  var fpLine = document.getElementById('fpLine');
  var cardOverlay = document.getElementById('cardOverlay');
  var cardBadge = document.getElementById('cardBadge');
  var cardFishImg = document.getElementById('cardFish');
  var cardName = document.getElementById('cardName');
  var cardRarity = document.getElementById('cardRarity');
  var cardFact = document.getElementById('cardFact');
  var cardAch = document.getElementById('cardAch');
  var cardAchText = document.getElementById('cardAchText');
  var cardProgress = document.getElementById('cardProgress');
  var releaseBtn = document.getElementById('releaseBtn');

  var bookFab = document.getElementById('bookFab');
  var bookFabCount = document.getElementById('bookFabCount');
  var bookOverlay = document.getElementById('bookOverlay');
  var bookClose = document.getElementById('bookClose');
  var bookScroll = document.getElementById('bookScroll');
  var bookHome = document.getElementById('bookHome');
  var bookDetail = document.getElementById('bookDetail');
  var bookGrid = document.getElementById('bookGrid');
  var bookProgressCount = document.getElementById('bookProgressCount');
  var bookBar = document.getElementById('bookBar');
  var bookAchievements = document.getElementById('bookAchievements');
  var bookReset = document.getElementById('bookReset');
  var bookBack = document.getElementById('bookBack');
  var bookDetailFish = document.getElementById('bookDetailFish');
  var bookDetailFishWrap = document.getElementById('bookDetailFishWrap');
  var bookDetailName = document.getElementById('bookDetailName');
  var bookDetailRarity = document.getElementById('bookDetailRarity');
  var bookDetailNo = document.getElementById('bookDetailNo');
  var bookDetailFact = document.getElementById('bookDetailFact');
  var bookDetailStatus = document.getElementById('bookDetailStatus');

  var gyroFab = document.getElementById('gyroFab');
  var gyroDot = document.getElementById('gyroDot');
  var gyroSheet = document.getElementById('gyroSheet');
  var gyroClose = document.getElementById('gyroClose');
  var gyroStatus = document.getElementById('gyroStatus');
  var gyroEnableBtn = document.getElementById('gyroEnable');
  var gyroCalibrateBtn = document.getElementById('gyroCalibrate');
  var gyroSensitivity = document.getElementById('gyroSensitivity');
  var gyroSensitivityVal = document.getElementById('gyroSensitivityVal');
  var gyroInvert = document.getElementById('gyroInvert');
  var gyroDebug = document.getElementById('gyroDebug');
  var gyroSimCast = document.getElementById('gyroSimCast');
  var gyroSimBite = document.getElementById('gyroSimBite');
  var gyroSimHook = document.getElementById('gyroSimHook');

  var state = 'idle';
  var taps = 0;
  var collected = new Set();
  var timers = new Set();
  var bookOpen = false;
  var resetArmed = false;
  var resetTimer = null;
  var resetNoticeTimer = null;

  var gyroState = {
    supported: typeof window.DeviceMotionEvent !== 'undefined',
    enabled: false,
    baseline: null,
    beta: 0,
    gamma: 0,
    rateBeta: 0,
    rateGamma: 0,
    sensitivity: 1,
    invert: false,
    samples: 0,
    lastGesture: '',
    lastGestureAt: 0,
    lastDebugAt: 0,
    castLatch: false,
    hookLatch: false
  };

  var PROMPT = {
    idle: '溪水清浅，抛一竿试试',
    casting: '抛竿——',
    waiting: '静候鱼讯…',
    bite: '咬钩！快抬竿！',
    reeling: '连续点击收线！',
    landing: '中鱼啦！',
    miss: '……',
    card: ''
  };

  var BUTTON = {
    idle:    ['抛竿', false, 'normal'],
    casting: ['抛竿中…', true, 'normal'],
    waiting: ['等鱼咬钩…', true, 'normal'],
    bite:    ['抬竿！', false, 'bite'],
    reeling: ['收线 +1', false, 'reel'],
    landing: ['收竿中…', true, 'normal'],
    miss:    ['收竿…', true, 'normal'],
    card:    ['', true, 'normal']
  };

  // ======== 计时器统一管理 ========
  function delay(fn, ms) {
    var id = setTimeout(function () {
      timers.delete(id);
      fn();
    }, ms);
    timers.add(id);
    return id;
  }
  function clearTimers() {
    timers.forEach(function (id) { clearTimeout(id); });
    timers.clear();
  }

  // ======== 存档 ========
  function loadCollected() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var ids = JSON.parse(raw);
      if (!Array.isArray(ids)) return;
      ids.forEach(function (id) {
        if (FISH.some(function (f) { return f.id === id; })) collected.add(id);
      });
    } catch (err) { /* file:// 或隐私模式不支持时，退化为内存态 */ }
  }
  function saveCollected() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(collected)));
    } catch (err) { /* 忽略存储失败 */ }
  }

  // ======== 顶部收集槽 ========
  function buildSlots() {
    FISH.forEach(function (fish) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.id = fish.id;
      var img = document.createElement('img');
      img.src = fish.img;
      img.alt = fish.name;
      img.draggable = false;
      slot.appendChild(img);
      slotsEl.appendChild(slot);
    });
    refreshSlots();
  }

  function refreshSlots() {
    var slotList = slotsEl.querySelectorAll('.slot');
    Array.prototype.forEach.call(slotList, function (slot) {
      var got = collected.has(slot.dataset.id);
      var fish = FISH.filter(function (f) { return f.id === slot.dataset.id; })[0];
      slot.classList.toggle('got', got);
      slot.setAttribute('aria-label', fish.name + (got ? '（已收集）' : '（未收集）'));
    });
    countEl.textContent = String(collected.size);
    bookFabCount.textContent = collected.size + '/4';
    bookFab.setAttribute('aria-label', '打开图鉴，已收集 ' + collected.size + ' / 4');
  }

  function popSlot(id) {
    var slot = slotsEl.querySelector('[data-id="' + id + '"]');
    if (!slot) return;
    slot.classList.remove('pop');
    void slot.offsetWidth;
    slot.classList.add('pop');
    slot.addEventListener('animationend', function () {
      slot.classList.remove('pop');
    }, { once: true });
  }

  // ======== 状态渲染 ========
  function promptForState(s) {
    if (gyroState.enabled) {
      if (s === 'idle') return '甩手机抛竿，或点按钮';
      if (s === 'waiting') return '静候鱼讯…咬钩时上挑手机';
      if (s === 'bite') return '咬钩！上挑手机！';
    }
    return PROMPT[s] || '';
  }

  function renderState() {
    stage.dataset.state = state;
    promptEl.textContent = promptForState(state);

    var btn = BUTTON[state];
    actionBtn.textContent = btn[0];
    actionBtn.disabled = btn[1];
    actionBtn.dataset.tone = btn[2];

    reelPanel.hidden = state !== 'reeling';
  }

  function setCatMood(mood) {
    if (fpPaws) fpPaws.dataset.mood = mood || '';
  }

  function updateReelUI() {
    reelCountEl.textContent = String(taps);
    reelTicks.forEach(function (tick, i) {
      tick.classList.toggle('on', i < taps);
    });
  }

  function resetReelBar() {
    reelTimeFill.style.transition = 'none';
    reelTimeFill.style.width = '100%';
  }

  function burstSplash() {
    splash.classList.remove('show');
    void splash.offsetWidth;
    splash.classList.add('show');
  }
  splash.addEventListener('animationend', function () {
    splash.classList.remove('show');
  });

  function showToast(msg, bad) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('bad', !!bad);
    toastEl.classList.remove('show');
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    delay(function () { toastEl.classList.remove('show'); }, 1300);
  }

  function buzz(pattern) {
    if (!navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) { /* ignore */ }
  }

  // ======== 流程 ========
  function enterIdle() {
    clearTimers();
    state = 'idle';
    taps = 0;
    gyroState.castLatch = false;
    gyroState.hookLatch = false;
    resetReelBar();
    updateReelUI();
    cardOverlay.hidden = true;
    toastEl.classList.remove('show');
    splash.classList.remove('show');
    setCatMood('');
    renderState();
  }

  function startCast() {
    if (state !== 'idle') return;
    clearTimers();
    state = 'casting';
    resetReelBar();
    taps = 0;
    updateReelUI();
    setCatMood('');
    renderState();

    delay(function () {
      if (state !== 'casting') return;
      state = 'waiting';
      setCatMood('bobbing');
      renderState();

      var wait = CONFIG.WAIT_MIN + Math.random() * (CONFIG.WAIT_MAX - CONFIG.WAIT_MIN);
      delay(startBite, wait);
    }, CONFIG.CAST_ANIM);
  }

  function startBite() {
    if (state !== 'waiting') return;
    clearTimers();
    gyroState.hookLatch = false;
    state = 'bite';
    setCatMood('nervous');
    renderState();
    burstSplash();
    buzz([30, 45, 30]);

    delay(function () {
      if (state === 'bite') miss('迟疑了，鱼跑了');
    }, CONFIG.BITE_WINDOW);
  }

  function attemptHook() {
    if (state !== 'bite') return;
    clearTimers();

    if (Math.random() < CONFIG.CATCH_RATE) {
      buzz(50);
      startReeling();
    } else {
      buzz([90, 40, 90]);
      miss('跑鱼了…');
    }
  }

  function startReeling() {
    clearTimers();
    state = 'reeling';
    taps = 0;
    updateReelUI();
    resetReelBar();
    setCatMood('reeling');
    renderState();
    burstSplash();

    // 收线总时限进度条
    void reelTimeFill.offsetWidth;
    reelTimeFill.style.transition = 'width ' + CONFIG.REEL_TIMEOUT + 'ms linear';
    reelTimeFill.style.width = '0%';

    delay(function () {
      if (state === 'reeling') miss('线松了，鱼跑了');
    }, CONFIG.REEL_TIMEOUT);
  }

  function reelTap() {
    if (state !== 'reeling') return;
    taps += 1;
    updateReelUI();

    if (taps >= CONFIG.REEL_TAPS) {
      succeedReel();
    }
  }

  function pickFish() {
    var weights = FISH.map(function (fish) {
      return fish.rarity === 'rare' ? CONFIG.RARE_WEIGHT : CONFIG.COMMON_WEIGHT;
    });
    var total = weights.reduce(function (sum, w) { return sum + w; }, 0);
    var roll = Math.random() * total;
    for (var i = 0; i < FISH.length; i++) {
      roll -= weights[i];
      if (roll < 0) return FISH[i];
    }
    return FISH[FISH.length - 1];
  }

  function succeedReel() {
    clearTimers();
    taps = CONFIG.REEL_TAPS;
    updateReelUI();
    state = 'landing';
    setCatMood('hop');
    renderState();
    burstSplash();
    buzz([20, 30, 20, 30, 60]);

    var fish = pickFish();
    var isNew = !collected.has(fish.id);
    var newAchievements = [];

    if (isNew) {
      var beforeIds = ACHIEVEMENTS.filter(function (a) {
        return isAchievementDone(a, collected);
      }).map(function (a) { return a.id; });

      collected.add(fish.id);
      saveCollected();
      refreshSlots();
      popSlot(fish.id);

      newAchievements = ACHIEVEMENTS.filter(function (a) {
        return isAchievementDone(a, collected) && beforeIds.indexOf(a.id) === -1;
      });
    }

    delay(function () { showCard(fish, isNew, newAchievements); }, CONFIG.CARD_DELAY);
  }

  function showCard(fish, isNew, newAchievements) {
    state = 'card';
    renderState();

    cardFishImg.src = fish.img;
    cardFishImg.alt = fish.name;
    cardName.textContent = fish.name;
    cardRarity.textContent = rarityText(fish);
    cardRarity.className = 'rarity ' + fish.rarity;
    cardFact.textContent = fish.fact;
    cardProgress.textContent = collected.size >= FISH.length
      ? '已收集 4 / 4 · 图鉴集齐'
      : '已收集 ' + collected.size + ' / 4';

    if (newAchievements && newAchievements.length) {
      cardAch.hidden = false;
      cardAchText.textContent = '解锁成就 · ' + newAchievements.map(function (a) { return a.name; }).join('、');
    } else {
      cardAch.hidden = true;
      cardAchText.textContent = '';
    }

    if (isNew && collected.size >= FISH.length) {
      cardBadge.textContent = '图鉴集齐！';
    } else if (isNew) {
      cardBadge.textContent = '新鱼种！';
    } else {
      cardBadge.textContent = '已收集过';
    }
    cardBadge.classList.toggle('repeat', !isNew);

    cardOverlay.hidden = false;
  }

  function miss(msg) {
    clearTimers();
    taps = 0;
    resetReelBar();
    updateReelUI();
    state = 'miss';
    setCatMood('sad');
    renderState();
    burstSplash();
    buzz(120);
    showToast(msg, true);

    delay(enterIdle, CONFIG.MISS_HOLD);
  }

  // ======== 体感（陀螺仪）测试 ========
  var GYRO_THRESH = {
    RATE: 200,     // 角速度阈值 deg/s
    CAST: 26,      // 相对基准的前倾角
    HOOK: 22,      // 相对基准的上挑角
    COOLDOWN: 520
  };

  function setGyroStatus(kind) {
    var map = {
      off: ['陀螺仪：未开启', ''],
      on: ['陀螺仪：已开启', 'on'],
      waiting: ['陀螺仪：已开启，等待动作数据…', 'warn'],
      denied: ['陀螺仪：权限被拒绝，可继续用按钮', 'warn'],
      unsupported: ['此设备 / 浏览器不支持陀螺仪，可继续用按钮', 'warn']
    };
    var conf = map[kind] || map.off;
    gyroStatus.textContent = conf[0];
    gyroStatus.classList.toggle('bad', kind === 'denied' || kind === 'unsupported');
    gyroFab.classList.toggle('on', kind === 'on' || kind === 'waiting');
    gyroFab.classList.toggle('warn', kind === 'denied' || kind === 'unsupported');
  }

  function updateGyroDebug(force) {
    var now = Date.now();
    if (!force && now - gyroState.lastDebugAt < 100) return;
    gyroState.lastDebugAt = now;
    if (!force && gyroSheet.hidden) return;
    var delta = gyroState.baseline == null ? 0 : gyroState.beta - gyroState.baseline;
    gyroDebug.textContent = [
      '状态：' + (gyroState.enabled ? '已开启' : '未开启') +
        (gyroState.supported ? '' : '（不支持）'),
      'beta ' + gyroState.beta.toFixed(1) + '°    gamma ' + gyroState.gamma.toFixed(1) + '°',
      'rate ' + gyroState.rateBeta.toFixed(1) + '°/s    delta ' + delta.toFixed(1) + '°',
      '基准 ' + (gyroState.baseline == null ? '--' : gyroState.baseline.toFixed(1)) + '°    样本 ' + gyroState.samples,
      '最近手势：' + (gyroState.lastGesture || '无')
    ].join('\n');
  }

  function gestureAction(kind) {
    var now = Date.now();
    if (bookOpen || !gyroSheet.hidden) return;
    if (now - gyroState.lastGestureAt < GYRO_THRESH.COOLDOWN) return;

    var dir = gyroState.invert ? -1 : 1;
    var sens = gyroState.sensitivity || 1;
    var rate = gyroState.rateBeta * dir;
    var delta = gyroState.baseline == null ? 0 : (gyroState.beta - gyroState.baseline) * dir;

    var cast = rate < -GYRO_THRESH.RATE / sens || delta < -GYRO_THRESH.CAST / sens;
    var hook = rate > GYRO_THRESH.RATE / sens || delta > GYRO_THRESH.HOOK / sens;

    if (kind === 'cast' && state === 'idle' && cast && !gyroState.castLatch) {
      gyroState.castLatch = true;
      gyroState.lastGesture = '抛竿';
      gyroState.lastGestureAt = now;
      updateGyroDebug(true);
      startCast();
    } else if (kind === 'hook' && state === 'bite' && hook && !gyroState.hookLatch) {
      gyroState.hookLatch = true;
      gyroState.lastGesture = '抬竿';
      gyroState.lastGestureAt = now;
      updateGyroDebug(true);
      attemptHook();
    }
  }

  function onOrientation(e) {
    var beta = Number(e.beta);
    if (!isFinite(beta)) return;
    gyroState.beta = beta;
    gyroState.gamma = Number(e.gamma) || 0;
    gyroState.samples += 1;

    if (gyroState.baseline == null) {
      gyroState.baseline = beta;
      updateGyroDebug();
      return;
    }

    // 只在静止且未咬钩时缓慢跟随当前姿势，避免把玩家的甩动吃掉
    if ((state === 'idle' || state === 'waiting') && Math.abs(gyroState.rateBeta) < 35) {
      gyroState.baseline += (beta - gyroState.baseline) * 0.03;
    }

    gestureAction('cast');
    gestureAction('hook');
    updateGyroDebug();
  }

  function onMotion(e) {
    var rr = e.rotationRate;
    if (rr) {
      gyroState.rateBeta = Number(rr.beta) || 0;
      gyroState.rateGamma = Number(rr.gamma) || 0;
    }
    gyroState.samples += 1;
    gestureAction('cast');
    gestureAction('hook');
    updateGyroDebug();
  }

  function enableGyro() {
    if (gyroState.enabled) return;
    if (!gyroState.supported) { setGyroStatus('unsupported'); return; }

    window.addEventListener('deviceorientation', onOrientation, { passive: true });
    window.addEventListener('devicemotion', onMotion, { passive: true });
    gyroState.enabled = true;
    gyroState.baseline = null;
    gyroState.samples = 0;
    gyroEnableBtn.textContent = '已开启';
    gyroEnableBtn.disabled = true;
    setGyroStatus('on');
    renderState();
    showToast('体感已开启：先保持姿势，再甩手机抛竿');

    setTimeout(function () {
      if (gyroState.enabled && gyroState.samples === 0) setGyroStatus('waiting');
    }, 1600);
  }

  function requestGyro() {
    if (!gyroState.supported) { setGyroStatus('unsupported'); return; }
    if (gyroState.enabled) return;

    var DO = window.DeviceOrientationEvent;
    var DM = window.DeviceMotionEvent;
    var asks = [];
    if (DO && typeof DO.requestPermission === 'function') asks.push(DO.requestPermission());
    if (DM && typeof DM.requestPermission === 'function') asks.push(DM.requestPermission());

    if (!asks.length) { enableGyro(); return; }

    Promise.all(asks).then(function (results) {
      if (results.indexOf('granted') !== -1) enableGyro();
      else setGyroStatus('denied');
    }).catch(function () {
      setGyroStatus('denied');
    });
  }

  function calibrateGyro() {
    if (!gyroState.enabled) {
      showToast('先开启体感再校准', true);
      return;
    }
    gyroState.baseline = gyroState.beta;
    gyroState.lastGesture = '';
    gyroState.lastGestureAt = 0;
    showToast('已按当前姿势校准');
    updateGyroDebug(true);
  }

  function openGyroSheet() {
    gyroSheet.hidden = false;
    gyroFab.setAttribute('aria-expanded', 'true');
    gyroState.lastDebugAt = 0;
    updateGyroDebug(true);
  }

  function closeGyroSheet() {
    gyroSheet.hidden = true;
    gyroFab.setAttribute('aria-expanded', 'false');
  }

  // ======== 图鉴 ========
  function disarmReset() {
    resetArmed = false;
    clearTimeout(resetTimer);
    resetTimer = null;
    bookReset.classList.remove('armed');
    if (!bookReset.classList.contains('reset-done')) {
      bookReset.textContent = '重置图鉴';
    }
  }

  function armReset() {
    resetArmed = true;
    clearTimeout(resetTimer);
    clearTimeout(resetNoticeTimer);
    bookReset.classList.remove('reset-done');
    bookReset.textContent = '再点一次确认重置';
    bookReset.classList.add('armed');
    resetTimer = setTimeout(disarmReset, 3000);
  }

  function showBookHome() {
    bookHome.hidden = false;
    bookDetail.hidden = true;
    bookScroll.scrollTop = 0;
    disarmReset();
  }

  function openFishDetail(fish) {
    var got = collected.has(fish.id);
    var idx = FISH.indexOf(fish);

    bookHome.hidden = true;
    bookDetail.hidden = false;
    bookDetailFish.src = fish.img;
    bookDetailFish.alt = got ? fish.name : '尚未发现的鱼';
    bookDetailFishWrap.classList.toggle('locked', !got);
    bookDetailName.textContent = got ? fish.name : '？？？';
    bookDetailRarity.textContent = rarityText(fish);
    bookDetailRarity.className = 'rarity ' + fish.rarity + (got ? '' : ' muted');
    bookDetailNo.textContent = 'NO.' + String(idx + 1).padStart(2, '0') + (got ? ' · 已点亮' : ' · 未点亮');
    bookDetailFact.textContent = got
      ? fish.fact
      : '还没有遇见这种鱼。稀有鱼种更爱清凉的砾石底，耐心多抛几竿吧。';
    bookDetailStatus.textContent = got
      ? '已点亮 · 图鉴第 ' + (idx + 1) + ' 格'
      : '未点亮 · 继续去溪边找找看';
    bookDetailStatus.classList.toggle('locked', !got);
    bookScroll.scrollTop = 0;
  }

  function renderBook() {
    bookGrid.innerHTML = '';

    FISH.forEach(function (fish) {
      var got = collected.has(fish.id);
      var tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'book-tile ' + (got ? 'got' : 'locked');
      tile.setAttribute('aria-label', got
        ? fish.name + '，' + rarityText(fish) + '，查看科普'
        : '未发现的' + rarityText(fish) + '鱼');

      var imgWrap = document.createElement('div');
      imgWrap.className = 'book-tile-img';
      var img = document.createElement('img');
      img.src = fish.img;
      img.alt = got ? fish.name : '';
      img.draggable = false;
      imgWrap.appendChild(img);

      var nameRow = document.createElement('div');
      nameRow.className = 'book-tile-name';
      var nameSpan = document.createElement('span');
      nameSpan.textContent = got ? fish.name : '？？？';
      var tag = document.createElement('span');
      tag.className = 'rarity ' + fish.rarity + (got ? '' : ' muted');
      tag.textContent = rarityText(fish);
      nameRow.appendChild(nameSpan);
      nameRow.appendChild(tag);

      tile.appendChild(imgWrap);
      tile.appendChild(nameRow);
      tile.addEventListener('click', function () { openFishDetail(fish); });
      bookGrid.appendChild(tile);
    });

    bookProgressCount.textContent = String(collected.size);
    Array.prototype.forEach.call(bookBar.children, function (seg, i) {
      seg.classList.toggle('on', i < collected.size);
    });

    bookAchievements.innerHTML = '';
    ACHIEVEMENTS.forEach(function (a) {
      var done = isAchievementDone(a, collected);
      var row = document.createElement('div');
      row.className = 'ach-row' + (done ? ' done' : '');

      var icon = document.createElement('div');
      icon.className = 'ach-icon';
      icon.textContent = a.icon;

      var body = document.createElement('div');
      body.className = 'ach-body';
      var name = document.createElement('div');
      name.className = 'ach-name';
      name.textContent = a.name;
      var desc = document.createElement('div');
      desc.className = 'ach-desc';
      desc.textContent = a.desc;
      body.appendChild(name);
      body.appendChild(desc);

      var stateEl = document.createElement('div');
      stateEl.className = 'ach-state';
      stateEl.textContent = done
        ? '已达成'
        : Math.min(a.progress(collected), a.target) + ' / ' + a.target;

      row.appendChild(icon);
      row.appendChild(body);
      row.appendChild(stateEl);
      bookAchievements.appendChild(row);
    });

    disarmReset();
    bookReset.classList.remove('reset-done');
  }

  function openBook() {
    if (state !== 'idle' || bookOpen) return;
    bookOpen = true;
    showBookHome();
    renderBook();
    bookOverlay.hidden = false;
    bookFab.setAttribute('aria-expanded', 'true');
    bookClose.focus({ preventScroll: true });
  }

  function closeBook() {
    if (!bookOpen) return;
    bookOpen = false;
    bookOverlay.hidden = true;
    bookFab.setAttribute('aria-expanded', 'false');
    disarmReset();
    clearTimeout(resetNoticeTimer);
    bookReset.classList.remove('reset-done');
    bookReset.textContent = '重置图鉴';
    bookFab.focus({ preventScroll: true });
  }

  function finishReset() {
    collected.clear();
    saveCollected();
    refreshSlots();
    showBookHome();
    renderBook();
    clearTimeout(resetNoticeTimer);
    bookReset.textContent = '图鉴已重置';
    bookReset.classList.add('reset-done');
    resetNoticeTimer = setTimeout(function () {
      bookReset.classList.remove('reset-done');
      bookReset.textContent = '重置图鉴';
    }, 1600);
  }

  // ======== 交互 ========
  actionBtn.addEventListener('click', function () {
    if (state === 'idle') startCast();
    else if (state === 'bite') attemptHook();
    else if (state === 'reeling') reelTap();
  });

  releaseBtn.addEventListener('click', function () {
    if (state !== 'card') return;
    cardOverlay.hidden = true;
    enterIdle();
  });

  bookFab.addEventListener('click', openBook);
  bookClose.addEventListener('click', closeBook);
  bookOverlay.addEventListener('click', function (e) {
    if (e.target === bookOverlay) closeBook();
  });
  bookBack.addEventListener('click', function () {
    showBookHome();
    renderBook();
  });
  bookReset.addEventListener('click', function () {
    if (!resetArmed) {
      armReset();
      return;
    }
    disarmReset();
    finishReset();
  });

  gyroFab.addEventListener('click', openGyroSheet);
  gyroClose.addEventListener('click', closeGyroSheet);
  gyroSheet.addEventListener('click', function (e) {
    if (e.target === gyroSheet) closeGyroSheet();
  });
  gyroEnableBtn.addEventListener('click', requestGyro);
  gyroCalibrateBtn.addEventListener('click', calibrateGyro);
  gyroSensitivity.addEventListener('input', function () {
    gyroState.sensitivity = Number(this.value) || 1;
    gyroSensitivityVal.textContent = gyroState.sensitivity.toFixed(1);
  });
  gyroInvert.addEventListener('change', function () {
    gyroState.invert = this.checked;
    gyroState.baseline = gyroState.beta;
    updateGyroDebug(true);
  });
  gyroSimCast.addEventListener('click', function () {
    if (state === 'idle') startCast();
    else showToast('现在不是抛竿时机', true);
  });
  gyroSimBite.addEventListener('click', function () {
    if (state === 'waiting') startBite();
    else showToast('先抛竿，等“静候鱼讯”', true);
  });
  gyroSimHook.addEventListener('click', function () {
    if (state === 'bite') attemptHook();
    else showToast('现在没有咬钩', true);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!gyroSheet.hidden) { closeGyroSheet(); return; }
      if (bookOpen) closeBook();
      return;
    }
    if (e.code === 'Space' && !bookOpen && gyroSheet.hidden) {
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      if (!actionBtn.disabled) actionBtn.click();
    }
  });

  // 预加载四张鱼图，避免卡片弹出一瞬间空白
  window.addEventListener('load', function () {
    setTimeout(function () {
      FISH.forEach(function (fish) {
        var img = new Image();
        img.src = fish.img;
      });
    }, 250);
  });

  // ======== 初始化 ========
  loadCollected();
  buildSlots();
  resetReelBar();
  updateReelUI();
  setGyroStatus(gyroState.supported ? 'off' : 'unsupported');
  updateGyroDebug(true);
  renderState();
})();
</script>
</body>
</html>
